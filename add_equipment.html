<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Equipment - AgriShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card add-equip-card">
        <div class="auth-card-header">
            <span class="auth-emoji">🚜</span>
            <h2 class="auth-title">List Your Machinery</h2>
            <p class="auth-subtitle">Share your equipment with your village &amp; earn extra income.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/add-equipment" method="POST">
            <div class="form-group mb-15">
                <label>Equipment Name / Title</label>
                <input type="text" name="title" required placeholder="e.g. Mahindra Tractor 475">
            </div>

            <div class="form-group mb-15">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select a category...</option>
                    <option value="Tractor">🚜 Tractor</option>
                    <option value="Harvester">🌾 Harvester</option>
                    <option value="Irrigation Pump">💧 Irrigation Pump</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group mb-15">
                    <label>Hourly Rate (₹)</label>
                    <input type="number" step="0.01" min="1" name="hourly_rate" required placeholder="e.g. 500">
                </div>
                <div class="form-group mb-15">
                    <label>Daily Rate (₹)</label>
                    <input type="number" step="0.01" min="1" name="daily_rate" placeholder="e.g. 3500 (optional)">
                </div>
            </div>

            <button type="submit" class="btn btn-green w-100">✅ Publish Listing</button>
        </form>

        <p class="auth-footer">
            ← <a href="/">Back to Dashboard</a>
        </p>
    </div>

</body>
</html>
