<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - AgriShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-card-header">
            <span class="auth-emoji">🔐</span>
            <h2 class="auth-title">Change Password</h2>
            <p class="auth-subtitle">Update your account password to keep your profile secure.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/change-password" method="POST">
            <div class="form-group mb-15">
                <label>Current Password</label>
                <input type="password" name="current_password" required placeholder="Enter your current password...">
            </div>
            <div class="form-group mb-15">
                <label>New Password</label>
                <input type="password" name="new_password" required placeholder="Enter new password (min 6 chars)...">
            </div>
            <div class="form-group mb-20">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter new password...">
            </div>
            <button type="submit" class="btn btn-green w-100">🔒 Update Password</button>
        </form>

        <p class="auth-footer">
            ← <a href="/">Back to Dashboard</a>
        </p>
    </div>

</body>
</html>
